[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project]
name = "countscape"
version = "0.2.0"
description = "An offline photo countdown wallpaper for Ubuntu GNOME/Wayland"
readme = "README.md"
requires-python = ">=3.15.2"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "countdown",
    "gnome",
    "multi-monitor",
    "offline",
    "systemd",
    "ubuntu",
    "wallpaper",
    "wayland",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Desktop Environment :: Gnome",
]
dependencies = ["pillow>=13.0.0"]

[[project.authors]]
name = "Countscape contributors"

[project.scripts]
countscape = "countscape.cli:main"

[project.urls]
Homepage = "https://github.com/tylermowll/countscape"
Changelog = "https://github.com/tylermowll/countscape/blob/main/CHANGELOG.md"
Documentation = "https://github.com/tylermowll/countscape#readme"
Issues = "https://github.com/tylermowll/countscape/issues"
Repository = "https://github.com/tylermowll/countscape.git"
Security = "https://github.com/tylermowll/countscape/security/policy"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
