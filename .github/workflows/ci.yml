name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Synchronize locked environment
        run: uv sync --locked

      - name: Check privacy boundary
        run: uv run python tools/privacy_check.py

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Smoke-test built wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv tool run --from "$wheel" countscape --help
