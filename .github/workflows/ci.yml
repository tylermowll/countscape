name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Ubuntu 26.04 / Python 3.14
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked environment
        run: uv sync --locked --all-groups

      - name: Audit worktree and complete reachable history
        run: uv run python tools/privacy_check.py --history

      - name: Check local Markdown links
        run: uv run python tools/check_markdown_links.py

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test with branch coverage gate
        run: >-
          uv run pytest
          --cov=countscape
          --cov-branch
          --cov-report=term-missing
          --cov-config=.coveragerc

      - name: Build wheel and source distribution once
        run: uv build --no-sources --clear --out-dir dist

      - name: Validate exact distribution set
        run: >-
          uv run python tools/release_check.py
          --artifacts dist/*.whl dist/*.tar.gz
          --write-checksums dist/SHA256SUMS

      - name: Audit release artifacts
        run: >-
          uv run python tools/privacy_check.py
          --history --artifacts dist/*.whl dist/*.tar.gz

      - name: Smoke-test wheel and sdist outside checkout
        env:
          DIST_DIR: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          smoke_root="${RUNNER_TEMP}/countscape-smoke"
          mkdir -p "${smoke_root}"
          expected_version="$(uv run python tools/release_check.py --print-version)"
          cd "${smoke_root}"
          wheel=("${DIST_DIR}"/*.whl)
          sdist=("${DIST_DIR}"/*.tar.gz)
          test "${#wheel[@]}" -eq 1
          test "${#sdist[@]}" -eq 1
          wheel_version="$(uv tool run --isolated --from "${wheel[0]}" countscape --version)"
          test "${wheel_version}" = "countscape ${expected_version}"
          uv tool run --isolated --from "${wheel[0]}" countscape --help
          sdist_version="$(uv tool run --isolated --from "${sdist[0]}" countscape --version)"
          test "${sdist_version}" = "countscape ${expected_version}"
          uv tool run --isolated --from "${sdist[0]}" countscape --help

      - name: Upload tested distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: countscape-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
