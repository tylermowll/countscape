name: Dependency graph

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    name: Submit locked Python dependencies
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.15.2"

      - name: Export and validate dependency snapshot
        env:
          SNAPSHOT_PATH: ${{ runner.temp }}/countscape-dependency-snapshot.json
          JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --no-project --python 3.15.2 python tools/dependency_snapshot.py \
            --sha "${GITHUB_SHA}" \
            --ref "${GITHUB_REF}" \
            --job-id "${JOB_ID}" \
            --job-url "${JOB_URL}" \
            --output "${SNAPSHOT_PATH}"

      - name: Submit exact snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_PATH: ${{ runner.temp }}/countscape-dependency-snapshot.json
        run: >-
          gh api --method POST
          -H 'Accept: application/vnd.github+json'
          -H 'X-GitHub-Api-Version: 2022-11-28'
          "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots"
          --input "${SNAPSHOT_PATH}"
